name: iOS Build and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - production

env:
  NODE_VERSION: '20.x'
  RUBY_VERSION: '3.3'
  XCODE_VERSION: '16.3'

jobs:
  build-ios:
    runs-on: macos-15  # Latest macOS runner with M-series chips
    timeout-minutes: 45
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          working-directory: ios

      - name: 📱 Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: 🗄️ Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 🗄️ Cache Derived Data
        uses: actions/cache@v3
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-${{ hashFiles('ios/Podfile.lock') }}-${{ hashFiles('**/*.swift', '**/*.m', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-derived-

      - name: 🗄️ Cache Expo prebuild
        uses: actions/cache@v3
        with:
          path: .expo
          key: ${{ runner.os }}-expo-${{ hashFiles('app.json', 'package.json') }}

      - name: 📦 Install dependencies
        run: |
          npm ci

      - name: 🛠️ Expo prebuild
        run: |
          # Set NODE_ENV based on build type
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.event.inputs.build_type }}" == "production" ]]; then
            export NODE_ENV=production
          else
            export NODE_ENV=development
          fi
          
          # Backup Fastlane files before prebuild
          if [ -d "ios/fastlane" ]; then
            cp -r ios/fastlane ./fastlane-backup
          fi
          if [ -f "ios/Gemfile" ]; then
            cp ios/Gemfile ./Gemfile-backup
          fi
          
          # Clean and prebuild iOS
          rm -rf ios
          npx expo prebuild --platform ios
          
          # Restore Fastlane files after prebuild
          if [ -d "fastlane-backup" ]; then
            cp -r fastlane-backup ios/fastlane
          fi
          if [ -f "Gemfile-backup" ]; then
            cp Gemfile-backup ios/Gemfile
          fi

      - name: 📱 Install iOS dependencies
        working-directory: ios
        run: |
          bundle install
          pod install --repo-update

      - name: 🚀 Build Development (Firebase Distribution)
        if: github.ref == 'refs/heads/develop' || github.event.inputs.build_type == 'development'
        working-directory: ios
        env:
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > ${{ runner.temp }}/gsa-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="${{ runner.temp }}/gsa-key.json"
          bundle exec fastlane ios development

      - name: 🚀 Build Production (TestFlight)
        if: github.ref == 'refs/heads/main' || github.event.inputs.build_type == 'production'
        working-directory: ios
        env:
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane ios production

      - name: 📤 Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            ios/*.ipa
            ios/*.app.dSYM.zip
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

      - name: 🧹 Cleanup
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true